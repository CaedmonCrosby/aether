<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER — Cosmic Synthesizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
  
  :root {
    --bg: #050508;
    --panel: #0a0a10;
    --accent: #7dd3fc;
    --accent2: #c026ff;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system_ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: linear-gradient(to bottom, rgba(5,5,8,0.95), transparent);
    z-index: 100;
    position: relative;
  }
  
  .title {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -1.5px;
    background: linear-gradient(90deg, #fff, #7dd3fc, #c026ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .title::before {
    content: "✧";
    font-size: 22px;
    background: linear-gradient(90deg, #7dd3fc, #c026ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .subtitle {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-left: 4px;
  }
  
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }
  
  .badge {
    background: rgba(125, 211, 252, 0.1);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 1px;
    border: 1px solid rgba(125, 211, 252, 0.2);
  }
  
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }
  
  #viz {
    display: block;
    width: 100%;
    flex: 1;
    max-height: calc(100vh - 210px);
    cursor: crosshair;
    background: #020204;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.6);
  }
  
  .controls {
    background: var(--panel);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 16px 24px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: start;
  }
  
  .sliders {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
    gap: 14px 22px;
  }
  
  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  
  .slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  
  .slider-label span:last-child {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  
  input[type="range"] {
    accent-color: #7dd3fc;
    width: 100%;
    height: 3px;
    background: #1f2937;
    border-radius: 999px;
    outline: none;
  }
  
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  
  .preset-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.1s ease;
    white-space: nowrap;
  }
  
  .preset-btn:hover {
    background: rgba(125, 211, 252, 0.1);
    border-color: rgba(125, 211, 252, 0.3);
    transform: translateY(-1px);
  }
  
  .preset-btn:active {
    transform: scale(0.98);
  }
  
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  
  button {
    background: #111318;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.1s cubic-bezier(0.23, 1, 0.32, 1);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  
  button:hover {
    background: #1a1f29;
    border-color: rgba(255,255,255,0.2);
  }
  
  button.primary {
    background: linear-gradient(90deg, #0ea5e9, #7dd3fc);
    color: #050508;
    border: none;
    font-weight: 500;
  }
  
  button.primary:hover {
    filter: brightness(1.1);
  }
  
  .keyboard-hint {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    background: rgba(5,5,8,0.6);
    padding: 2px 10px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 10;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.04);
  }
  
  .info {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(5,5,8,0.7);
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
    z-index: 20;
    backdrop-filter: blur(12px);
  }
  
  .status {
    font-size: 12px;
    color: #22c55e;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .status::before {
    content: "";
    display: block;
    width: 6px;
    height: 6px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 6px #22c55e;
  }
  
  .footer {
    position: absolute;
    bottom: 8px;
    left: 24px;
    font-size: 10px;
    color: #334155;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">AETHER <span class="subtitle">/  AETHER</span></div>
    </div>
    <div class="header-right">
      <div class="status" id="status">READY</div>
      <div class="badge">NO DEPENDENCIES • PURE WEB</div>
    </div>
  </div>

  <div class="main">
    <canvas id="viz" width="1920" height="1080"></canvas>
    
    <div class="info" id="voice-count">0 voices</div>
    
    <div class="keyboard-hint">Z X C V B N M , . / &nbsp;&nbsp;•&nbsp;&nbsp; S D &nbsp;G H J &nbsp;&nbsp;•&nbsp;&nbsp; [ ] change octave &nbsp;&nbsp;•&nbsp;&nbsp; SPACE random chord</div>
    
    <div class="controls">
      <div class="sliders">
        <div class="slider-group">
          <div class="slider-label"><span>CUTOFF</span><span id="val-cutoff">820</span></div>
          <input type="range" id="cutoff" min="120" max="3800" step="1" value="820">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>RESONANCE</span><span id="val-res">1.8</span></div>
          <input type="range" id="resonance" min="0.2" max="9" step="0.1" value="1.8">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>REVERB</span><span id="val-reverb">0.65</span></div>
          <input type="range" id="reverb" min="0" max="0.95" step="0.01" value="0.65">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>DELAY</span><span id="val-delay">0.42</span></div>
          <input type="range" id="delay" min="0" max="0.8" step="0.01" value="0.42">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>FLOW</span><span id="val-flow">0.6</span></div>
          <input type="range" id="flow" min="0.05" max="2.2" step="0.01" value="0.6">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>DENSITY</span><span id="val-density">0.7</span></div>
          <input type="range" id="density" min="0.1" max="1.6" step="0.01" value="0.7">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>HUE SHIFT</span><span id="val-hue">0</span></div>
          <input type="range" id="hue" min="-80" max="80" step="1" value="0">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>BRIGHTNESS</span><span id="val-bright">1.0</span></div>
          <input type="range" id="bright" min="0.4" max="1.6" step="0.01" value="1.0">
        </div>
      </div>
      
      <div>
        <div class="presets" style="margin-bottom:10px">
          <button class="preset-btn" data-preset="nebula">NEBULA CHOIR</button>
          <button class="preset-btn" data-preset="crystal">CRYSTAL STRINGS</button>
          <button class="preset-btn" data-preset="plasma">PLASMA LEAD</button>
          <button class="preset-btn" data-preset="void">VOID BASS</button>
          <button class="preset-btn" data-preset="aurora">AURORA PADS</button>
        </div>
        
        <div class="actions">
          <button id="snapshot">📸 SNAPSHOT</button>
          <button id="strum">STRUM MODE</button>
          <button id="auto">✧ AUTO JAM</button>
          <button id="panic">PANIC</button>
          <button class="primary" id="inspire">INSPIRE ME</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">AETHER — forged in a single conversation with Grok • 2026</div>

<script>
// ============== AETHER — Cosmic Synthesizer ==============
// Pure single-file interactive experience. No external dependencies.

const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d', { alpha: true });

let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 1920, H = 1080;
let mx = 0.5, my = 0.5; // normalized mouse

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = Math.floor(rect.width * DPR);
  H = Math.floor(rect.height * DPR);
  canvas.width = W;
  canvas.height = H;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); });
setTimeout(resize, 60);

// ============== PARAMETERS (live) ==============
const params = {
  cutoff: 820,
  resonance: 1.8,
  reverb: 0.65,
  delay: 0.42,
  flow: 0.6,
  density: 0.7,
  hue: 0,
  bright: 1.0
};

// ============== AUDIO ==============
let audioCtx = null;
let masterGain = null;
let filterNode = null;
let delayNode = null;
let delayGain = null;
let reverbGain = null;
let reverbDelay = null;
let compressor = null;

const activeVoices = new Map(); // note -> {osc1, osc2, osc3, noise, gain, filter, releaseAt}

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.78;
  
  compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -24;
  compressor.knee.value = 12;
  compressor.ratio.value = 3;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.25;
  
  filterNode = audioCtx.createBiquadFilter();
  filterNode.type = 'lowpass';
  filterNode.frequency.value = params.cutoff;
  filterNode.Q.value = params.resonance;
  
  // Spacey delay
  delayNode = audioCtx.createDelay(1.2);
  delayNode.delayTime.value = 0.38;
  delayGain = audioCtx.createGain();
  delayGain.gain.value = params.delay * 0.7;
  
  const delayFilter = audioCtx.createBiquadFilter();
  delayFilter.type = 'lowpass';
  delayFilter.frequency.value = 2100;
  
  // Simple lush reverb via parallel delays + feedback
  reverbGain = audioCtx.createGain();
  reverbGain.gain.value = params.reverb * 0.6;
  
  const rev1 = audioCtx.createDelay(0.7);
  rev1.delayTime.value = 0.041;
  const rev2 = audioCtx.createDelay(0.7);
  rev2.delayTime.value = 0.057;
  const rev3 = audioCtx.createDelay(0.7);
  rev3.delayTime.value = 0.113;
  
  const revGain1 = audioCtx.createGain(); revGain1.gain.value = 0.62;
  const revGain2 = audioCtx.createGain(); revGain2.gain.value = 0.51;
  const revGain3 = audioCtx.createGain(); revGain3.gain.value = 0.43;
  
  const revLP = audioCtx.createBiquadFilter();
  revLP.type = 'lowpass';
  revLP.frequency.value = 2800;
  
  // Feedback loop
  const revFB = audioCtx.createGain();
  revFB.gain.value = 0.72;
  
  // Connect reverb
  reverbGain.connect(rev1);
  reverbGain.connect(rev2);
  reverbGain.connect(rev3);
  rev1.connect(revGain1); rev2.connect(revGain2); rev3.connect(revGain3);
  revGain1.connect(revLP); revGain2.connect(revLP); revGain3.connect(revLP);
  revLP.connect(revFB);
  revFB.connect(reverbGain); // feedback
  
  // Main chain
  filterNode.connect(masterGain);
  masterGain.connect(compressor);
  
  // FX sends
  const fxSend = audioCtx.createGain();
  fxSend.gain.value = 1.0;
  masterGain.connect(fxSend);
  
  fxSend.connect(delayNode);
  delayNode.connect(delayFilter);
  delayFilter.connect(delayGain);
  delayGain.connect(compressor);
  
  fxSend.connect(reverbGain);
  reverbGain.connect(compressor);
  
  compressor.connect(audioCtx.destination);
  
  // Update from params
  updateAudioParams();
}

function updateAudioParams() {
  if (!filterNode) return;
  filterNode.frequency.value = params.cutoff;
  filterNode.Q.value = params.resonance;
  if (delayGain) delayGain.gain.value = params.delay * 0.72;
  if (reverbGain) reverbGain.gain.value = params.reverb * 0.62;
}

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function playNote(note, velocity = 0.85, duration = null) {
  ensureAudio();
  
  const now = audioCtx.currentTime;
  const freq = midiToFreq(note);
  
  // Kill existing voice on same note
  if (activeVoices.has(note)) stopNote(note, true);
  
  // Voice architecture — rich but light
  const osc1 = audioCtx.createOscillator(); // main saw
  osc1.type = 'sawtooth';
  osc1.frequency.value = freq;
  
  const osc2 = audioCtx.createOscillator(); // body / detune
  osc2.type = 'sine';
  osc2.frequency.value = freq * 1.005;
  
  const osc3 = audioCtx.createOscillator(); // high harmonic sparkle
  osc3.type = 'triangle';
  osc3.frequency.value = freq * 2.003;
  
  const noise = audioCtx.createBufferSource();
  const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.8, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  noise.buffer = noiseBuf;
  
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = freq * 3.6 + 600;
  noiseFilter.Q.value = 2.8;
  
  // Per-voice lowpass for movement
  const vFilter = audioCtx.createBiquadFilter();
  vFilter.type = 'lowpass';
  vFilter.frequency.value = Math.min(5200, params.cutoff * (0.6 + velocity * 0.7));
  vFilter.Q.value = 0.6;
  
  const gain = audioCtx.createGain();
  gain.gain.value = 0.0001;
  
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.0008 * (0.6 + velocity * 0.8);
  
  // Slight stereo spread
  const panner = audioCtx.createStereoPanner();
  panner.pan.value = (Math.random() - 0.5) * 0.7;
  
  // Connections
  osc1.connect(vFilter);
  osc2.connect(vFilter);
  osc3.connect(vFilter);
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  vFilter.connect(gain);
  noiseGain.connect(gain);
  gain.connect(panner);
  panner.connect(filterNode);
  
  // Envelopes
  const attack = 0.004 + Math.random() * 0.006;
  const decay = 0.28 + Math.random() * 0.2;
  const sus = 0.62 + velocity * 0.18;
  
  const t0 = now;
  gain.gain.cancelScheduledValues(t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(velocity * 0.72, t0 + attack);
  gain.gain.linearRampToValueAtTime(velocity * sus * 0.72, t0 + attack + decay);
  
  noiseGain.gain.cancelScheduledValues(t0);
  noiseGain.gain.setValueAtTime(0.0008 * (0.5 + velocity * 0.7), t0);
  noiseGain.gain.linearRampToValueAtTime(0.0004 * velocity, t0 + 0.18);
  
  osc1.start(t0);
  osc2.start(t0);
  osc3.start(t0);
  noise.start(t0);
  
  const voice = { osc1, osc2, osc3, noise, gain, vFilter, panner, note, started: t0 };
  activeVoices.set(note, voice);
  
  updateVoiceCount();
  
  // Visual reaction — excite strings and emit particles
  triggerVisualNote(note, velocity);
  
  if (duration) {
    setTimeout(() => stopNote(note), duration);
  }
  
  return voice;
}

function stopNote(note, immediate = false) {
  const v = activeVoices.get(note);
  if (!v) return;
  
  const now = audioCtx ? audioCtx.currentTime : 0;
  const rel = immediate ? 0.012 : 0.48 + Math.random() * 0.6;
  
  if (v.gain) {
    v.gain.gain.cancelScheduledValues(now);
    v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.linearRampToValueAtTime(0.0001, now + rel);
  }
  
  setTimeout(() => {
    try {
      v.osc1.stop(); v.osc2.stop(); v.osc3.stop(); v.noise.stop();
    } catch(e){}
    activeVoices.delete(note);
    updateVoiceCount();
  }, rel * 1000 + 30);
}

function updateVoiceCount() {
  const el = document.getElementById('voice-count');
  el.textContent = `${activeVoices.size} voice${activeVoices.size === 1 ? '' : 's'}`;
  el.style.color = activeVoices.size > 4 ? '#f472b6' : '#22c55e';
}

function panic() {
  for (const note of activeVoices.keys()) {
    stopNote(note, true);
  }
  activeVoices.clear();
  updateVoiceCount();
}

// ============== VISUALS ==============
let particles = [];
let stars = [];
let strings = []; // cosmic strings — array of point arrays
let lastEmit = 0;
let autoMode = false;
let autoTimer = 0;
let strumMode = false;

function initStars() {
  stars = [];
  for (let i = 0; i < 380; i++) {
    stars.push({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      z: Math.random() * 0.6 + 0.4, // parallax layer
      size: Math.random() * 1.6 + 0.5,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.012 + 0.003
    });
  }
}

function initStrings() {
  strings = [];
  const count = 7;
  for (let s = 0; s < count; s++) {
    const pts = [];
    const baseY = 280 + s * 68 + (s % 2) * 11;
    const segments = 9;
    for (let i = 0; i <= segments; i++) {
      const x = 220 + (i / segments) * (1920 - 440);
      pts.push({
        x, y: baseY,
        baseY,
        vx: 0, vy: 0,
        offset: (i - segments / 2) * 0.6
      });
    }
    strings.push({ pts, tension: 0.82 + Math.random() * 0.1, damp: 0.965 });
  }
}

function createParticle(x, y, vx, vy, life, size, hueOff = 0) {
  particles.push({
    x, y, vx, vy,
    life, maxLife: life,
    size,
    hue: 195 + hueOff + (params.hue || 0),
    alpha: 0.9,
    phase: Math.random() * Math.PI * 2
  });
}

function triggerVisualNote(note, velocity) {
  // Map note to string excitement and particle burst
  const idx = (note % 12);
  const strIndex = Math.floor((idx / 12) * strings.length) % strings.length;
  const str = strings[strIndex];
  
  if (str) {
    // Excite the string
    const excite = 6.5 + velocity * 11;
    for (let i = 1; i < str.pts.length - 1; i++) {
      const p = str.pts[i];
      const dist = Math.abs(i - str.pts.length / 2);
      p.vy += (Math.sin(i * 1.7) * excite) * (1 - dist * 0.08);
      p.vx += (Math.random() - 0.5) * 1.8;
    }
  }
  
  // Particle burst around the "resonance zone"
  const centerX = 420 + ((note - 48) % 36) * 22;
  const centerY = 310 + Math.sin(note) * 70;
  
  const burst = Math.floor(12 + velocity * 26 * params.density);
  for (let i = 0; i < burst; i++) {
    const ang = (i / burst) * Math.PI * 2 + Math.random() * 0.8;
    const spd = 0.8 + Math.random() * 3.2 + velocity * 1.5;
    createParticle(
      centerX + Math.cos(ang) * (8 + Math.random() * 22),
      centerY + Math.sin(ang) * (14 + Math.random() * 18),
      Math.cos(ang) * spd,
      Math.sin(ang) * spd * 0.6 - 0.6,
      38 + Math.random() * 55,
      1.6 + Math.random() * 2.4 + velocity * 1.5,
      (note % 7) * 9 - 12
    );
  }
  
  // Extra glowing orbs for higher notes
  if (velocity > 0.6 && note > 58) {
    for (let k = 0; k < 3; k++) {
      createParticle(centerX, centerY - 20, (Math.random()-0.5)*1.5, -1.8 - Math.random(), 55, 3.2, 22);
    }
  }
}

function updateAndDrawVisuals(dt, t) {
  ctx.save();
  
  // Deep space background
  const grad = ctx.createRadialGradient(W*0.5/DPR, H*0.38/DPR, 80, W*0.5/DPR, H*0.55/DPR, Math.max(W,H)*0.9/DPR);
  grad.addColorStop(0, '#0a0b14');
  grad.addColorStop(0.35, '#050508');
  grad.addColorStop(1, '#020203');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W/DPR, H/DPR);
  
  // Slow flowing nebula layers (very cheap but beautiful)
  const hueBase = 195 + (params.hue || 0);
  ctx.globalAlpha = 0.28 * params.bright;
  
  for (let layer = 0; layer < 3; layer++) {
    const lx = (W/DPR) * (0.38 + Math.sin(t * 0.021 + layer) * 0.12);
    const ly = (H/DPR) * (0.42 + Math.cos(t * 0.017 + layer * 1.7) * 0.09);
    const r = 420 + layer * 110;
    
    const ng = ctx.createRadialGradient(lx, ly, r * 0.2, lx + 90, ly + 70, r);
    ng.addColorStop(0, `hsla(${hueBase + layer * 11}, 85%, 68%, ${0.35 + layer * 0.05})`);
    ng.addColorStop(0.5, `hsla(${hueBase + 22 + layer * 9}, 75%, 52%, 0.18)`);
    ng.addColorStop(1, 'transparent');
    
    ctx.fillStyle = ng;
    ctx.beginPath();
    ctx.arc(lx, ly, r, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.globalAlpha = 1;
  
  // Stars
  ctx.fillStyle = '#e2e8f0';
  for (const s of stars) {
    const px = s.x + (mx - 0.5) * 38 * (1 - s.z);
    const py = s.y + (my - 0.5) * 22 * (1 - s.z);
    const tw = 0.65 + Math.sin(s.twinkle + t * s.speed * 3) * 0.35;
    ctx.globalAlpha = 0.35 + tw * 0.65;
    ctx.fillRect(px, py, s.size * s.z, s.size * s.z);
    
    // occasional bigger sparkle
    if (tw > 0.92) {
      ctx.globalAlpha = 0.25;
      ctx.fillRect(px - 0.6, py, s.size * 1.8, 0.6);
      ctx.fillRect(px, py - 0.6, 0.6, s.size * 1.8);
    }
  }
  ctx.globalAlpha = 1;
  
  // Update + draw cosmic strings
  const flow = params.flow;
  ctx.lineCap = 'round';
  
  for (const str of strings) {
    // Physics
    for (let i = 1; i < str.pts.length - 1; i++) {
      const p = str.pts[i];
      const targetY = p.baseY + Math.sin(t * 1.1 + p.offset) * 1.6;
      
      p.vy += (targetY - p.y) * 0.012 * str.tension;
      p.vy *= str.damp * (1 - flow * 0.018);
      p.vx *= 0.978;
      
      p.y += p.vy * (0.6 + flow * 0.55) * 0.7;
      p.x += p.vx * 0.6;
    }
    
    // Draw glow passes
    ctx.strokeStyle = `hsla(${hueBase + 28}, 90%, 82%, 0.08)`;
    ctx.lineWidth = 11;
    ctx.shadowColor = `hsla(${hueBase}, 80%, 75%, 0.35)`;
    ctx.shadowBlur = 26;
    
    ctx.beginPath();
    ctx.moveTo(str.pts[0].x, str.pts[0].y);
    for (let i = 1; i < str.pts.length; i++) {
      const p = str.pts[i];
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    
    // Core string
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `hsla(${hueBase + 10}, 70%, 92%, ${0.65 * params.bright})`;
    ctx.lineWidth = 1.35;
    ctx.beginPath();
    ctx.moveTo(str.pts[0].x, str.pts[0].y);
    for (let i = 1; i < str.pts.length; i++) ctx.lineTo(str.pts[i].x, str.pts[i].y);
    ctx.stroke();
    
    // Bright inner filament
    ctx.strokeStyle = `hsla(205, 95%, 96%, ${0.9 * params.bright})`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(str.pts[0].x, str.pts[0].y);
    for (let i = 1; i < str.pts.length; i++) ctx.lineTo(str.pts[i].x, str.pts[i].y);
    ctx.stroke();
  }
  
  // Particles
  const grav = 0.012 * flow;
  const lifeMul = 0.985 - (params.flow - 0.6) * 0.01;
  
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * 60 * 0.9;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    
    p.vx *= 0.992;
    p.vy = p.vy * 0.985 + grav;
    p.x += p.vx * (0.7 + params.flow * 0.4);
    p.y += p.vy * (0.8 + params.flow * 0.35);
    
    const lifeT = p.life / p.maxLife;
    p.alpha = lifeT * 0.9;
    
    const sz = p.size * (0.6 + lifeT * 0.7);
    
    ctx.fillStyle = `hsla(${p.hue}, 88%, 78%, ${p.alpha * params.bright})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
    ctx.fill();
    
    // soft glow halo for brighter particles
    if (sz > 1.8) {
      ctx.fillStyle = `hsla(${p.hue}, 90%, 82%, ${p.alpha * 0.18})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz * 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Idle ambient particles (nebula dust)
  const now = performance.now();
  if (now - lastEmit > (52 - params.density * 18)) {
    lastEmit = now;
    const emitCount = Math.floor(1 + params.density * 2.2);
    for (let e = 0; e < emitCount; e++) {
      const ex = 180 + Math.random() * (W/DPR - 360);
      const ey = 160 + Math.random() * 520;
      createParticle(
        ex, ey,
        (Math.random() - 0.5) * 0.6 * params.flow,
        (Math.random() - 0.5) * 0.5 * params.flow - 0.1,
        65 + Math.random() * 70,
        0.7 + Math.random() * 1.1,
        Math.random() * 32 - 14
      );
    }
  }
  
  // Mouse reactive energy field
  if (strumMode) {
    ctx.strokeStyle = `hsla(${hueBase + 40}, 85%, 82%, 0.12)`;
    ctx.lineWidth = 1.5;
    for (let r = 1; r < 4; r++) {
      ctx.beginPath();
      ctx.arc(mx * (W/DPR), my * (H/DPR), 28 + r * 17 + Math.sin(t * 3) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  
  ctx.restore();
}

// ============== SLIDERS ==============
function bindSliders() {
  const ids = ['cutoff', 'resonance', 'reverb', 'delay', 'flow', 'density', 'hue', 'bright'];
  ids.forEach(id => {
    const input = document.getElementById(id);
    const valEl = document.getElementById('val-' + id);
    
    function sync() {
      let v = parseFloat(input.value);
      params[id === 'cutoff' ? 'cutoff' : id] = v;
      
      if (id === 'cutoff') valEl.textContent = Math.round(v);
      else if (id === 'hue') valEl.textContent = v;
      else valEl.textContent = v.toFixed(2);
      
      updateAudioParams();
    }
    
    input.addEventListener('input', sync);
    // initial
    let initV = params[id === 'cutoff' ? 'cutoff' : id];
    input.value = initV;
    if (id === 'cutoff') valEl.textContent = Math.round(initV);
    else if (id === 'hue') valEl.textContent = initV;
    else valEl.textContent = initV.toFixed(2);
  });
}

// ============== PRESETS ==============
const presets = {
  nebula:  { cutoff: 1250, resonance: 2.4, reverb: 0.78, delay: 0.51, flow: 0.55, density: 0.95, hue: 12,  bright: 1.05 },
  crystal: { cutoff: 1850, resonance: 3.8, reverb: 0.55, delay: 0.29, flow: 1.05, density: 0.55, hue: -32, bright: 1.18 },
  plasma:  { cutoff: 680,  resonance: 1.3, reverb: 0.38, delay: 0.18, flow: 1.45, density: 0.85, hue: 38,  bright: 1.32 },
  void:    { cutoff: 310,  resonance: 0.9, reverb: 0.82, delay: 0.61, flow: 0.28, density: 1.15, hue: -58, bright: 0.82 },
  aurora:  { cutoff: 1480, resonance: 4.6, reverb: 0.71, delay: 0.44, flow: 0.82, density: 1.35, hue: -8,  bright: 1.12 }
};

function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  
  Object.assign(params, p);
  
  // sync UI
  document.getElementById('cutoff').value = p.cutoff;
  document.getElementById('resonance').value = p.resonance;
  document.getElementById('reverb').value = p.reverb;
  document.getElementById('delay').value = p.delay;
  document.getElementById('flow').value = p.flow;
  document.getElementById('density').value = p.density;
  document.getElementById('hue').value = p.hue;
  document.getElementById('bright').value = p.bright;
  
  document.getElementById('val-cutoff').textContent = Math.round(p.cutoff);
  document.getElementById('val-res').textContent = p.resonance.toFixed(1);
  document.getElementById('val-reverb').textContent = p.reverb.toFixed(2);
  document.getElementById('val-delay').textContent = p.delay.toFixed(2);
  document.getElementById('val-flow').textContent = p.flow.toFixed(2);
  document.getElementById('val-density').textContent = p.density.toFixed(2);
  document.getElementById('val-hue').textContent = p.hue;
  document.getElementById('val-bright').textContent = p.bright.toFixed(2);
  
  updateAudioParams();
  
  // Play a beautiful chord appropriate to the preset
  const base = name === 'void' ? 36 : (name === 'plasma' ? 58 : 48);
  const chord = (name === 'void') ? [0, 7, 12, 15] : 
                (name === 'crystal') ? [0, 4, 7, 11, 14] : 
                (name === 'plasma') ? [0, 3, 7, 10] : [0, 5, 7, 12, 16];
  
  chord.forEach((off, i) => {
    setTimeout(() => {
      playNote(base + off, 0.68 + Math.random() * 0.2, 820 + i * 70);
    }, i * 38);
  });
  
  // Extra visual excitement
  for (let k = 0; k < 3; k++) {
    setTimeout(() => {
      strings.forEach((str, si) => {
        if (si % 2 === 0) {
          str.pts.forEach((pt, j) => {
            if (j % 2 === 0) pt.vy += (2.5 + Math.random() * 3) * (1 - k * 0.2);
          });
        }
      });
    }, k * 70);
  }
}

// ============== KEYBOARD + INTERACTION ==============
const keyMap = {
  'z': 48, 's': 49, 'x': 50, 'd': 51, 'c': 52, 'v': 53, 'g': 54, 'b': 55, 'h': 56, 'n': 57, 'j': 58, 'm': 59,
  ',': 60, '.': 61, '/': 62
};

let octaveShift = 0;

function handleKey(e, down) {
  if (e.repeat) return;
  
  const k = e.key.toLowerCase();
  
  if (k === ' ' && down) {
    e.preventDefault();
    playRandomChord();
    return;
  }
  if ((k === '[' || k === ']') && down) {
    octaveShift += (k === '[' ? -12 : 12);
    octaveShift = Math.max(-24, Math.min(24, octaveShift));
    return;
  }
  
  const baseNote = keyMap[k];
  if (baseNote == null) return;
  
  const note = baseNote + octaveShift;
  
  if (down) {
    playNote(note, 0.78 + Math.random() * 0.18);
  } else {
    stopNote(note);
  }
}

document.addEventListener('keydown', e => handleKey(e, true));
document.addEventListener('keyup', e => handleKey(e, false));

function playRandomChord() {
  const root = 42 + Math.floor(Math.random() * 16);
  const intervals = Math.random() > 0.5 ? [0, 7, 12, 16, 19] : [0, 5, 7, 12, 14, 17];
  intervals.forEach((iv, i) => {
    setTimeout(() => playNote(root + iv, 0.55 + Math.random() * 0.25, 650 + i * 90), i * 26);
  });
}

// Mouse / touch on canvas
let isMouseDown = false;

function canvasToNorm(e) {
  const rect = canvas.getBoundingClientRect();
  mx = (e.clientX - rect.left) / rect.width;
  my = (e.clientY - rect.top) / rect.height;
}

canvas.addEventListener('mousemove', e => {
  canvasToNorm(e);
  if (isMouseDown && strumMode) {
    // strum / excite nearby strings + play notes
    const note = 46 + Math.floor(my * 26);
    if (Math.random() < 0.38) playNote(note, 0.4 + my * 0.4, 180);
    
    // physical excite
    strings.forEach((str, si) => {
      const targetY = my * (H / DPR * 0.82) + 90;
      str.pts.forEach((p, i) => {
        const influence = 1 - Math.abs(i - str.pts.length * mx) / (str.pts.length * 0.6);
        if (influence > 0.1) {
          p.vy += (targetY - p.y) * influence * 0.09;
        }
      });
    });
  }
});

canvas.addEventListener('mousedown', e => {
  isMouseDown = true;
  canvasToNorm(e);
  ensureAudio();
  
  const note = 44 + Math.floor(my * 28);
  const vel = 0.55 + (1 - my) * 0.38;
  playNote(note, vel);
  
  if (strumMode) {
    // big excite
    strings.forEach(str => {
      str.pts.forEach((p, i) => {
        const d = Math.abs((i / str.pts.length) - mx);
        p.vy += (my * 240 + 80 - p.y) * (1 - d * 1.4) * 0.07;
      });
    });
  }
});

window.addEventListener('mouseup', () => { isMouseDown = false; });

canvas.addEventListener('touchmove', e => {
  if (e.touches[0]) {
    const rect = canvas.getBoundingClientRect();
    mx = (e.touches[0].clientX - rect.left) / rect.width;
    my = (e.touches[0].clientY - rect.top) / rect.height;
  }
}, { passive: true });

// ============== BUTTONS ==============
function bindButtons() {
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
  });
  
  document.getElementById('snapshot').addEventListener('click', takeSnapshot);
  document.getElementById('panic').addEventListener('click', panic);
  
  const strumBtn = document.getElementById('strum');
  strumBtn.addEventListener('click', () => {
    strumMode = !strumMode;
    strumBtn.style.background = strumMode ? 'rgba(192, 38, 255, 0.15)' : '';
    strumBtn.style.borderColor = strumMode ? 'rgba(192, 38, 255, 0.4)' : '';
  });
  
  const autoBtn = document.getElementById('auto');
  autoBtn.addEventListener('click', () => {
    autoMode = !autoMode;
    autoBtn.style.background = autoMode ? 'rgba(125, 211, 252, 0.15)' : '';
    autoBtn.style.borderColor = autoMode ? 'rgba(125, 211, 252, 0.4)' : '';
    if (autoMode) autoTimer = performance.now() + 180;
  });
  
  document.getElementById('inspire').addEventListener('click', () => {
    // Surprise the user with a beautiful evolving moment
    const names = Object.keys(presets);
    applyPreset(names[Math.floor(Math.random() * names.length)]);
    
    // Play an evolving sequence
    const root = 47 + Math.floor(Math.random() * 11);
    const seq = [0, 3, 7, 10, 14, 12, 19, 7];
    seq.forEach((iv, i) => {
      setTimeout(() => {
        playNote(root + iv, 0.6 + Math.sin(i) * 0.15, 520 + i * 40);
        if (i === 3) {
          // extra visual
          strings.forEach((s, si) => { if (si % 2) s.pts.forEach(p => p.vy -= 3.5 + Math.random() * 2); });
        }
      }, i * 95);
    });
  });
}

function takeSnapshot() {
  // High quality export
  const link = document.createElement('a');
  link.download = `aether-${Date.now()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// ============== AUTO JAM ==============
function runAuto(t) {
  if (!autoMode) return;
  if (t < autoTimer) return;
  
  autoTimer = t + 180 + Math.random() * 260;
  
  if (activeVoices.size > 5) return;
  
  const root = 42 + Math.floor(Math.random() * 19);
  const choices = Math.random() > 0.5 ? [0, 7, 12] : [0, 5, 9, 14];
  
  choices.forEach((off, i) => {
    setTimeout(() => {
      if (autoMode) playNote(root + off, 0.48 + Math.random() * 0.3, 380 + i * 110);
    }, i * 32);
  });
  
  // Occasional string excitation from "wind"
  if (Math.random() < 0.6) {
    strings.forEach((str, i) => {
      if (i % 2 === 0) {
        str.pts[Math.floor(str.pts.length * 0.3 + Math.random() * 4)].vy -= 2.2 + Math.random() * 2.6;
      }
    });
  }
}

// ============== MAIN LOOP ==============
let lastTime = performance.now();

function loop(now) {
  const dt = Math.min(34, now - lastTime);
  lastTime = now;
  const t = now * 0.001;
  
  updateAndDrawVisuals(dt, t);
  runAuto(now);
  
  // Gentle idle evolution of strings
  if (!isMouseDown && !autoMode && Math.random() < 0.06) {
    const s = strings[Math.floor(Math.random() * strings.length)];
    const p = s.pts[1 + Math.floor(Math.random() * (s.pts.length - 2))];
    p.vy += (Math.random() - 0.5) * 1.1;
  }
  
  // Keep particle count reasonable
  if (particles.length > 820) particles.splice(0, particles.length - 820);
  
  requestAnimationFrame(loop);
}

// ============== INIT ==============
function init() {
  initStars();
  initStrings();
  
  bindSliders();
  bindButtons();
  
  // Gentle initial state
  params.hue = -6;
  document.getElementById('hue').value = -6;
  document.getElementById('val-hue').textContent = -6;
  
  // First beautiful preset feel
  setTimeout(() => {
    applyPreset('nebula');
    // Light idle particles
    for (let i = 0; i < 28; i++) {
      createParticle(
        280 + Math.random() * 1360,
        210 + Math.random() * 380,
        (Math.random() - 0.5) * 0.8,
        (Math.random() - 0.5) * 0.6 - 0.2,
        90 + Math.random() * 55,
        1.1 + Math.random() * 1.4,
        Math.random() * 24 - 8
      );
    }
  }, 420);
  
  // Kick off
  requestAnimationFrame(loop);
  
  // Subtle welcome chord after a moment (user will trigger audio properly on first interaction)
  setTimeout(() => {
    document.getElementById('status').textContent = 'LISTENING';
  }, 1400);
  
  // Easter egg: click title to do something cool
  document.querySelector('.title').addEventListener('click', () => {
    applyPreset('aurora');
    for (let i = 0; i < 5; i++) {
      setTimeout(() => playNote(55 + i * 2, 0.5, 420), i * 45);
    }
  });
  
  // Helpful console note
  console.log('%c[AETHER] Pure single-file cosmic synthesizer. Play with your keyboard or mouse.', 'color:#334155');
}

init();
